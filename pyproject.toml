[project]
name = "madmax-sbp"
version = "0.1.0"
description = "MADMAX spider bead-pull calibration, acquisition and verification"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "h5py>=3.10", "matplotlib>=3.8", "tqdm>=4.66"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "ipywidgets>=8"]
hardware = ["pyserial>=3.5", "rohdeschwarz>=1.0"]

[tool.uv]
package = false
